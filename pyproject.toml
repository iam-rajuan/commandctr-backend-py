[project]
name = "twinstr-backend-py"
version = "1.0.0"
description = "FastAPI backend for Twinstr."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bcrypt>=4.2.1",
  "cryptography>=43.0.3",
  "dnspython>=2.7.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.6",
  "httpx>=0.27.2",
  "motor>=3.6.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "pyjwt>=2.10.1",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.4",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
